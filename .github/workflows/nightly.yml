name: nightly

on:
  schedule:
    # 02:00 Beijing time (UTC+8).
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  desktop:
    uses: ./.github/workflows/desktop.yml

  chaos:
    name: "Chaos suites"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries (gmsh GLU + headless display for VTK)
        run: >
          sudo apt-get update && sudo apt-get install -y
          libglu1-mesa xvfb libxrender1 libxcursor1 libxft2 libxinerama1
          blender ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Cache Python runtime
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('python/requirements-core.txt', 'python/requirements-simulation-runtime.txt') }}

      - name: Fresh install (postinstall builds the Python runtime)
        run: npm install
        env:
          PI_CAD_SKIP_BLENDER: "1"

      - name: Chaos test suites
        run: xvfb-run -a npm run test:chaos
        env:
          MPLCONFIGDIR: /tmp/matplotlib-cache

  report:
    name: Report nightly failure
    needs: [ci, desktop, chaos]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = "nightly-failure";
            const body = `Nightly CI failed.\n\nRun: ${runUrl}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 1,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Nightly CI failed",
                body,
                labels: [label],
              });
            }
