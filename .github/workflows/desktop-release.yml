name: desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: package:win
            artifact: windows
            files: apps/desktop/release/Pi-CAD-Setup-*.exe
          - os: ubuntu-latest
            command: package:linux
            artifact: linux
            files: |
              apps/desktop/release/Pi-CAD-Linux-*.AppImage
              apps/desktop/release/Pi-CAD-Linux-*.deb
          - os: macos-14
            command: package:mac
            artifact: macos-arm64
            files: |
              apps/desktop/release/Pi-CAD-macOS-*.dmg
              apps/desktop/release/Pi-CAD-macOS-*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: QiuYi111/prime-agent
          ref: 9e49b73dd46908b3e400f4780b46a90daef69052
          path: prime-agent
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
            prime-agent/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci && npm run build
        working-directory: prime-agent
      - run: npm ci
        working-directory: apps/desktop
      - if: runner.os == 'macOS'
        run: bash scripts/make-mac-icon.sh
        working-directory: apps/desktop
      - run: npm run ${{ matrix.command }}
        working-directory: apps/desktop
        env:
          PRIME_AGENT_REPO: ${{ github.workspace }}/prime-agent
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: pi-cad-${{ matrix.artifact }}
          path: ${{ matrix.files }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
