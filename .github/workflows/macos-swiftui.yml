name: macOS SwiftUI client

on:
  pull_request:
    paths: ["apps/macos/**", "apps/desktop/electron/main/viewer.ts", "apps/desktop/electron/main/traces.ts", "src/experience/**", "src/modules/simulate-v2/**", "assets/simulation-runtimes.json", "scripts/probe-torch-fem-runtime.py", "scripts/desktop-rate-experience.mjs", "scripts/desktop-experience.mjs", "scripts/distill-experience.mjs", "scripts/adopt-experience-candidate.mjs", "scripts/evaluate-distillation-checkpoints.mjs", "apps/desktop/electron/main/settings-store.ts", "apps/desktop/electron/main/runtime-bridge.ts", "apps/desktop/electron/main/agent-api-client.ts", "apps/desktop/electron/main/cadctl-rpc.ts", "apps/desktop/electron/main/sha256.ts", "apps/desktop/electron/main/approvals.ts", "executors/fusion/ReifyExport/**", "apps/desktop/electron/main/cad-transfer*.ts", "apps/desktop/src/shared/cad-transfer-guide.ts", "src/agent-api/**", "src/harness/**", "apps/desktop/electron/main/step-import.ts", "apps/desktop/electron/main/cloud-uploads.ts", "apps/desktop/electron/main/runtime-state.ts", "apps/desktop/src/renderer/src/lib/activity.ts", "apps/desktop/src/renderer/src/lib/runtime-phase.ts", ".github/workflows/macos-swiftui.yml"]
  push:
    branches: [master, codex/macos-native-cloud-client]
    paths: ["apps/macos/**", "apps/desktop/electron/main/viewer.ts", "apps/desktop/electron/main/traces.ts", "src/experience/**", "src/modules/simulate-v2/**", "assets/simulation-runtimes.json", "scripts/probe-torch-fem-runtime.py", "scripts/desktop-rate-experience.mjs", "scripts/desktop-experience.mjs", "scripts/distill-experience.mjs", "scripts/adopt-experience-candidate.mjs", "scripts/evaluate-distillation-checkpoints.mjs", "apps/desktop/electron/main/settings-store.ts", "apps/desktop/electron/main/runtime-bridge.ts", "apps/desktop/electron/main/agent-api-client.ts", "apps/desktop/electron/main/cadctl-rpc.ts", "apps/desktop/electron/main/sha256.ts", "apps/desktop/electron/main/approvals.ts", "executors/fusion/ReifyExport/**", "apps/desktop/electron/main/cad-transfer*.ts", "apps/desktop/src/shared/cad-transfer-guide.ts", "src/agent-api/**", "src/harness/**", "apps/desktop/electron/main/step-import.ts", "apps/desktop/electron/main/cloud-uploads.ts", "apps/desktop/electron/main/runtime-state.ts", "apps/desktop/src/renderer/src/lib/activity.ts", "apps/desktop/src/renderer/src/lib/runtime-phase.ts", ".github/workflows/macos-swiftui.yml"]
  workflow_dispatch:

jobs:
  build-and-e2e:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/macos/package-lock.json
      - name: Install test service
        run: npm ci --prefix apps/macos
      - name: Install desktop workflow validator
        run: npm ci --ignore-scripts
      - name: Build native client, package DMG and run cloud protocol E2E
        run: npm run macos:test:e2e
      - name: Keep E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-e2e
          path: apps/macos/test-results/
      - name: Keep native packages
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-macos
          path: |
            apps/macos/dist/Reify-macOS-*.dmg
            apps/macos/dist/Reify-macOS-*.zip
