name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux-cpu:
    name: "Linux CPU: fresh install + full test suite"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # gmsh's bundled libgmsh dlopens libGLU.so.1, and VTK needs a headless
      # X server for the off-screen simulation views. Both come straight
      # from apt: the third-party setup-headless-display action hung
      # intermittently on its first step and stalled otherwise-green runs.
      - name: Install system libraries (gmsh GLU + headless display for VTK)
        run: >
          sudo apt-get update && sudo apt-get install -y
          libglu1-mesa xvfb libxrender1 libxcursor1 libxft2 libxinerama1
          blender ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Python runtime (venv + build123d/OCP + torch CPU + torch-fem + gmsh)
      # is built by the package postinstall; cache it keyed on the requirement
      # files so routine CI runs do not re-download the heavy wheels.
      - name: Cache Python runtime
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('python/requirements-core.txt', 'python/requirements-simulation-runtime.txt') }}

      - name: Fresh install (postinstall builds the Python runtime)
        run: npm install
        env:
          # Blender comes from apt in CI; the 350MB pinned download is not
          # worth the minutes. Presentation renders against the distro
          # Blender and the pinned-manifest path is exercised by its
          # fail-soft logic instead.
          PI_CAD_SKIP_BLENDER: "1"

      - name: Full test suite (TypeScript harness + Python backend)
        run: xvfb-run -a npm test
        env:
          MPLCONFIGDIR: /tmp/matplotlib-cache

  # The optional FreeCAD part backend. It runs beside, not inside, the job
  # above: a FreeCAD failure must not block the build123d path.
  freecad-backend:
    name: "FreeCAD part backend: install, worker tests, end to end"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # runtime.json and the conda environment live under this directory; the
      # key is the lock file, so a version bump rebuilds it.
      - name: Cache the FreeCAD runtime
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pi-cad/runtimes/freecad
          key: freecad-${{ runner.os }}-${{ hashFiles('python/runtimes/freecad/conda-linux-64.lock', 'scripts/bootstrap-freecad.sh') }}

      - name: Install FreeCAD (npm run setup:freecad)
        run: bash scripts/bootstrap-freecad.sh

      # reify-asi (Analysis Situs feature recognition) for the DFM geometry
      # check. Without it the DFM tests run the built-in fallback only.
      - name: Cache the reify-asi runtime
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pi-cad/runtimes/asi
          key: asi-${{ runner.os }}-${{ hashFiles('native/reify-asi/**', 'scripts/bootstrap-asi.sh') }}

      - name: Install reify-asi
        run: bash scripts/bootstrap-asi.sh

      # The e2e test needs the uv environment for identity binding and renders;
      # install without the heavy simulation extra.
      - name: Install Node and Python (core only)
        run: |
          npm ci --ignore-scripts
          uv sync --project python --no-install-project

      - name: Worker tests (run with the FreeCAD Python)
        run: |
          runtime="$HOME/.local/share/pi-cad/runtimes/freecad"
          python_bin="$(python3 -c "import json,sys; print(json.load(open('$runtime/runtime.json'))['python'])")"
          lib_dir="$(python3 -c "import json,sys; print(json.load(open('$runtime/runtime.json'))['libPath'])")"
          PI_CAD_FREECAD_PYTHON="$python_bin" PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/python:$lib_dir" \
            "$python_bin" -m unittest discover -s tests/freecad -v

      - name: Pure-Python and bridge tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/skills/cad/src" uv run --project python python -m unittest tests.test_reify_freecad_pure tests.test_bind_identity tests.test_render_highlight tests.test_face_fingerprints tests.test_cad_package tests.test_cad_transfer tests.test_transfer_geometry_pure
          node --import jiti/register tests/freecad-worker.test.ts
          node --import jiti/register tests/part-ops-authorization.test.ts
          node --import jiti/register tests/build-changes.test.ts
          python3 -m unittest discover -s tests/fusion_addin
          node --import jiti/register tests/transfer-ops.test.ts
          node --import jiti/register tests/part-dfm.test.ts
          node --import jiti/register tests/transfer-features-e2e.test.ts

      - name: End to end through the Agent API
        run: node --import jiti/register tests/part-e2e.test.ts
