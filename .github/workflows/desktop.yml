name: desktop

on:
  pull_request:
    paths: ["apps/desktop/**", "src/**", "skills/cad/**", "python/**", "tests/fixtures/**", "scripts/desktop-inspect-vtk.py", "scripts/postinstall.mjs", "package.json", "package-lock.json", ".github/workflows/desktop.yml"]
  push:
    branches: [master]
    paths: ["apps/desktop/**", "src/**", "skills/cad/**", "python/**", "tests/fixtures/**", "scripts/desktop-inspect-vtk.py", "scripts/postinstall.mjs", "package.json", "package-lock.json", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }} desktop
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      # uv runs the stdlib-only VTU inspector and the CAD worker test. The base
      # sync (no simulation extra) installs cadctl and build123d into python/.venv.
      - uses: astral-sh/setup-uv@v6
      # Root dependencies (typebox, jiti, yaml, undici) are imported by the desktop
      # tests through src/. Lifecycle scripts stay off, as in the smoke jobs.
      - run: npm ci --ignore-scripts
      - run: uv sync --frozen --project python
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop

  linux-package-smoke:
    name: Linux native package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: QiuYi111/prime-agent
          ref: 9e49b73dd46908b3e400f4780b46a90daef69052
          path: prime-agent
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      # packages/ai's build regenerates src/models.generated.ts from live model
      # catalogs, and the regenerated file does not type-check. Build the same
      # packages as the root `npm run build`, with the committed generated file.
      - run: |
          npm ci
          (cd packages/tui && npm run build)
          (cd packages/ai && npx tsgo -p tsconfig.build.json)
          (cd packages/agent && npm run build)
          (cd packages/coding-agent && npm run build)
        working-directory: prime-agent
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run package:linux
        working-directory: apps/desktop
        env:
          PRIME_AGENT_REPO: ${{ github.workspace }}/prime-agent
      - run: PI_CAD_PACKAGED_EXE="$PWD/release/linux-unpacked/Reify" PI_CAD_NATIVE_PACKAGE=1 npx playwright test tests/e2e/native-package.spec.ts
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: reify-linux-smoke
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  macos-package-smoke:
    name: macOS native package smoke
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: QiuYi111/prime-agent
          ref: 9e49b73dd46908b3e400f4780b46a90daef69052
          path: prime-agent
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      # packages/ai's build regenerates src/models.generated.ts from live model
      # catalogs, and the regenerated file does not type-check. Build the same
      # packages as the root `npm run build`, with the committed generated file.
      - run: |
          npm ci
          (cd packages/tui && npm run build)
          (cd packages/ai && npx tsgo -p tsconfig.build.json)
          (cd packages/agent && npm run build)
          (cd packages/coding-agent && npm run build)
        working-directory: prime-agent
      - run: npm ci
        working-directory: apps/desktop
      - run: bash scripts/make-mac-icon.sh
        working-directory: apps/desktop
      # Unsigned CI smoke build. The release script (package:mac) refuses to run
      # without signing and notarization credentials, and this job has none.
      - run: npm run package:mac:unsigned
        working-directory: apps/desktop
        env:
          PRIME_AGENT_REPO: ${{ github.workspace }}/prime-agent
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: PI_CAD_PACKAGED_EXE="$PWD/release/mac-arm64/Reify.app/Contents/MacOS/Reify" PI_CAD_NATIVE_PACKAGE=1 npx playwright test tests/e2e/native-package.spec.ts
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: reify-macos-smoke
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
