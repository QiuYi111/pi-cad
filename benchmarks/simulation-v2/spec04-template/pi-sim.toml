schema = 1
entrypoint = "bash Allrun"
observe = "uv run --offline --frozen --project /opt/pi-cad-runtime/python python observe.py"
nonvisual = false
inputs = [".ignored-benchmark-inputs/"]
observation_files = ["observe.py", "report-schemas/"]

[exports.phase_distribution]
type = "image"
primary = true

[exports.post_plug_trapped_gas]
type = "scalar"
primary = true
unit = "mm3"

[exports.pressure_history]
type = "timeseries"
primary = true
x_unit = "s"
y_unit = "Pa"

[exports.release_report]
type = "artifact"
primary = true
format = "json"

[exports.robustness]
type = "table"
primary = false

[exports.convergence]
type = "table"
primary = false
