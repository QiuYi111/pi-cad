schema: 1
id: simulation/openfoam-transient-vof
version: 1.0.0
kind: simulation
runtimeProfile: openfoam/openfoam-14
inputs:
  - {path: build/fluid-domain.step, role: fluid-domain, type: file}
actions:
  run:
    argv: [/bin/bash, Allrun]
    files: [Allrun, "0", constant, system]
    timeoutSeconds: 43200
observer:
  argv: [/bin/bash, -lc, 'uv run --offline --frozen --project "$PI_CAD_PYTHON_PROJECT" python observe.py']
  files: [observe.py]
  timeoutSeconds: 3600
exports:
  interface_context: {type: image, primary: true}
  continuity_error: {type: scalar, primary: true, unit: "1"}
  residual_history: {type: timeseries, primary: false}
  solver_log: {type: artifact, primary: false}
resources: {cpu: 8, memoryGiB: 24, workspaceGiB: 100}
