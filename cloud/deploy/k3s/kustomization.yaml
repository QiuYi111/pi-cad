# Apply with: kubectl apply -k cloud/deploy/k3s   (see cloud/deploy/README.md for the full order)
# Not included on purpose:
#   secret.template.yaml      (generated by make-secrets.sh into a file outside the repository, applied by hand)
#   reify-ws-config.yaml      (holds the real gateway public key; make-secrets.sh prints the real ConfigMap)
#   workspace-template.yaml   (rendered by the platform API controller per user)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - postgres.yaml
  - platform-api.yaml
  - platform-api-rbac.yaml
  - caddy.yaml
  - reify-ws-policy.yaml
# Set newTag to the value that cloud/platform-api/build.sh printed (reify/platform-api:<commit>).
images:
  - name: reify/platform-api
    newTag: REPLACE_WITH_TAG
