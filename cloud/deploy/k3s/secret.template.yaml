# TEMPLATE ONLY. Contains no real values. Do not commit a filled copy.
# Copy to a file outside the repository (for example /root/reify-secrets.yaml),
# replace every REPLACE_ME value, apply with "kubectl apply -f", then delete the copy.
# This file is not listed in kustomization.yaml on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: reify-postgres-auth
  namespace: reify-system
  labels:
    app.kubernetes.io/part-of: reify
type: Opaque
stringData:
  POSTGRES_USER: reify
  POSTGRES_DB: reify
  POSTGRES_PASSWORD: REPLACE_ME_RANDOM_32_CHARS
---
apiVersion: v1
kind: Secret
metadata:
  name: reify-platform-secrets
  namespace: reify-system
  labels:
    app.kubernetes.io/part-of: reify
type: Opaque
stringData:
  # Must use the same password as POSTGRES_PASSWORD above.
  DATABASE_URL: postgres://reify:REPLACE_ME_RANDOM_32_CHARS@postgres.reify-system.svc.cluster.local:5432/reify?sslmode=disable
  # ES256 private key, PEM (PKCS#8 or SEC1). Generate with openssl; see cloud/deploy/README.md.
  JWT_PRIVATE_KEY: |
    REPLACE_WITH_ES256_PRIVATE_KEY_PEM
  # ES256 private key for gateway tokens (plan 7.2). A second key, not the one above.
  # Its public half goes into the reify-gateway-pubkey ConfigMap in reify-ws.
  GATEWAY_PRIVATE_KEY: |
    REPLACE_WITH_SECOND_ES256_PRIVATE_KEY_PEM
  # Public origin seen by users, for example https://<machine>.<tailnet>.ts.net
  PUBLIC_BASE_URL: https://REPLACE_WITH_FUNNEL_HOSTNAME
