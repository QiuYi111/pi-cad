[project]
name = "pi-cad-torch-fem-cpu-runtime"
version = "0.9.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pi-cad-cadctl",
  "torch==2.13.0+cpu",
  "torch-fem==0.9.0",
  "gmsh==4.15.0",
  "meshio==5.3.5",
  "pyvista==0.48.4",
  "nlopt==2.9.1",
]

[tool.uv.sources]
pi-cad-cadctl = { path = "../..", editable = false }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
