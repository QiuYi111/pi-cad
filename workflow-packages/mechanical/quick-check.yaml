schema: 1
id: mechanical.quick-check
description: Read-only inspection of a current or explicitly selected historical CAD artifact.
tags: [cad, mechanical, inspect, read-only]
version: 1.0.0
workflow:
  schema: 1
  id: mechanical.quick-check
  version: 1.0.0
  parametersSchema: {type: object, additionalProperties: false}
  initialPhase: inspect
  phases:
    inspect:
      purpose: Measure or section one explicitly identified immutable artifact without changing project files.
      guidance: Record the target artifact path and SHA-256 before inspection. Use only read-only geometry operations, report objects and units, verify the artifact hash is unchanged, then advance checked. Do not enter concept, build, review, or release work.
      actions: [transition]
      grants: [file_read, observe, observe_programmable, shell, transition]
      writeScopes: [run:observation]
      recordObligations: []
      evidenceObligations: []
      contextProviders: [kernel.current-action, mechanical.mission, mechanical.observations]
      hooks: []
      transitions: {checked: {target: done}}
    done:
      purpose: Preserve the read-only inspection result.
      actions: []
      grants: [file_read]
      writeScopes: []
      recordObligations: []
      evidenceObligations: []
      contextProviders: [kernel.current-action]
      hooks: []
      transitions: {}
      terminal: true
