schema: 1
id: mechanical.default
description: Default mechanical design loop with one brief, one concept, one build loop, and independent final review.
tags: [cad, default, design, mechanical]
version: 1.0.0
workflow:
  schema: 1
  id: mechanical.default
  version: 1.0.0
  parametersSchema: {type: object, additionalProperties: false}
  initialPhase: grilling
  versionControl:
    init: true
    allowRemote: false
    phases:
      grilling: {onExit: [commit]}
      concept: {onExit: [commit]}
  phases:
    grilling:
      purpose: Resolve the request, constraints, and acceptance checks.
      guidance: >-
        In interactive mode use the grill-me skill and follow it as written.
        Resolve only decisions that materially change the design. Record the
        agreed purpose, dimensions, loads, interfaces, manufacturing assumptions,
        motion requirements, and pass/fail checks in one brief, then wait for the
        user's explicit confirmation. Headless runs use the configured
        requirements-review path instead.
      recommendedSkills: [grill-me]
      actions: [cad_commit, transition]
      grants: [file_read, transition]
      writeScopes: []
      recordObligations: [{ref: brief, type: workspace_commit, closeWith: cad_commit}]
      evidenceObligations: []
      contextProviders: [kernel.current-action]
      hooks: []
      transitions: {clarified: {target: concept, requiresPhaseObligations: true}}
    concept:
      purpose: Form the spatial and mechanical hypothesis before CAD work.
      guidance: >-
        Create one realistic concept sheet that is useful for building the model.
        Include overall multi-view drawings, focused interface views, and sections
        through important axes, holes, passages, nested parts, or hidden features.
        Resolve the layout, proportions, coordinate frames, part boundaries,
        interfaces, assembly order, and rough bill of materials in the same concept
        record.

        For movable designs, identify each moving body, degree of freedom, axis or
        path, constraints, required range, allowed contacts, and critical clearance
        regions. Show the start, endpoint, and critical intermediate pose or motion
        envelope.

        Reference the generated PNG in the concept commit. The image is a spatial
        and kinematic hypothesis. Exact dimensions, tolerances, fits, and final
        geometry come from the agreed brief and CAD construction.
      actions: [cad_commit, codex_generate_image, transition]
      grants: [file_read, image_generate, transition]
      writeScopes: [project:deliverable]
      recordObligations: [{ref: concept, type: workspace_commit, closeWith: cad_commit, dependsOn: [brief]}]
      evidenceObligations: [{ref: concept-image, type: concept_image, closeWith: codex_generate_image, dependsOn: [brief]}]
      contextProviders: [kernel.current-action, mechanical.mission]
      hooks: []
      transitions: {concept_ready: {target: modify, requiresPhaseObligations: true}}
    modify:
      rebuildContextOnExit: true
      purpose: Build, inspect, probe, and revise the complete candidate in one loop.
      guidance: >-
        Work on the complete product in this phase. Write deterministic build123d
        source, build through cad.model.build, inspect the managed views, run the
        probes required by the brief, and keep revising until the candidate passes.
        Do not create separate phase commits for parts, interfaces, BOM, or
        assembly. Keep those decisions in source and the concept record.

        Use validation="fast" while iterating and validation="full" before review
        when an earlier build deferred checks. For movable geometry, use
        cad.probe.run with task-specific kinematic code over the complete required
        range; start and endpoint checks alone are insufficient. Report sampling or
        solver tolerance, minimum clearance and pose, first failure, unreachable or
        singular states, and pass/fail.

        Keep only the latest ArtifactRef. When the latest build and probes satisfy
        the brief, create one review-candidate commit containing that ArtifactRef,
        deterministic source, and the structured checks. Then take review_ready and
        submit that exact commit in FINAL_REVIEW.
      actions: [cad_build_step, cad_commit, transition]
      grants: [file_read, file_edit_source, model_build, observe, observe_interference, observe_programmable, shell, transition]
      writeScopes: [project:deliverable, project:source, run:observation]
      recordObligations: []
      evidenceObligations:
        - {ref: candidate-visual, type: visual, closeWith: cad_build_step}
        - {ref: candidate-geometry, type: geometry, closeWith: cad_build_step}
      contextProviders: [kernel.current-action, mechanical.mission, mechanical.observations]
      hooks: [mechanical.candidate.observe]
      transitions: {review_ready: {target: final_review, requiresPhaseObligations: true}}
    final_review:
      purpose: Independently verify the brief against the immutable candidate.
      guidance: Submit exactly once using the review-candidate Commit created in MODIFY. The reviewer inspects the artifact and evidence, then moves the workflow automatically. Do not create another release commit or guess the review transition.
      actions: [cad_submit_for_review]
      grants: [file_read, observe, observe_programmable]
      writeScopes: [run:observation]
      recordObligations: []
      evidenceObligations: []
      contextProviders: [kernel.current-action, mechanical.mission, mechanical.observations]
      hooks: []
      reviewProfile: mechanical.final-review
      transitions:
        accepted: {target: done, reviewVerdicts: [pass]}
        revise_brief: {target: grilling, reviewVerdicts: [fail], invalidate: [brief, concept, concept-image, candidate-geometry, candidate-visual]}
        revise_concept: {target: concept, reviewVerdicts: [fail], invalidate: [concept, concept-image, candidate-geometry, candidate-visual]}
        revise_model: {target: modify, reviewVerdicts: [fail], invalidate: [candidate-geometry, candidate-visual]}
    done:
      purpose: Preserve the independently reviewed candidate.
      actions: []
      grants: [file_read]
      writeScopes: []
      recordObligations: []
      evidenceObligations: []
      contextProviders: [kernel.current-action]
      hooks: []
      transitions: {}
      terminal: true
