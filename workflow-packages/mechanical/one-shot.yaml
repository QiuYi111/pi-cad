schema: 1
id: mechanical.one-shot
description: Design and release a greenfield mechanical part or assembly with independent final review.
tags: [cad, design, mechanical, release]
version: 1.0.7
workflow:
  schema: 1
  id: mechanical.one-shot
  version: 1.0.7
  parametersSchema: {type: object, additionalProperties: false}
  initialPhase: grilling
  phases:
    grilling:
      purpose: Resolve the task intent, missing constraints, and user-owned decisions.
      guidance: In interactive mode use the grill-me skill and follow it as written. Wait for explicit confirmation before committing. Headless runs use the configured requirements-review path instead.
      recommendedSkills: [grill-me]
      actions: [cad_commit, transition]
      grants: [file_read, transition]
      writeScopes: []
      recordObligations: [{ref: grill, type: workspace_commit, closeWith: cad_commit}]
      evidenceObligations: []
      contextProviders: [kernel.current-action]
      hooks: []
      transitions: {clarified: {target: spec, requiresPhaseObligations: true}}
    spec:
      purpose: Freeze measurable requirements and acceptance criteria before proposing geometry.
      guidance: Commit dimensions, loads, interfaces, manufacturing assumptions, and pass/fail criteria as the specification.
      actions: [cad_commit, transition]
      grants: [file_read, transition]
      writeScopes: []
      recordObligations: [{ref: spec, type: workspace_commit, closeWith: cad_commit, dependsOn: [grill]}]
      evidenceObligations: []
      contextProviders: [kernel.current-action, mechanical.mission]
      hooks: []
      transitions: {specified: {target: concept, requiresPhaseObligations: true}}
    concept:
      purpose: Form a spatial hypothesis before detailed CAD.
      guidance: Generate at least one concept image before detailed CAD. Use it to explore arrangement and proportions, then reference the generated PNG in the concept commit. The image is a spatial hypothesis, never geometry authority.
      actions: [cad_commit, codex_generate_image, transition]
      grants: [file_read, image_generate, transition]
      writeScopes: [project:deliverable]
      recordObligations: [{ref: concept, type: workspace_commit, closeWith: cad_commit, dependsOn: [spec]}]
      evidenceObligations: [{ref: concept-image, type: concept_image, closeWith: codex_generate_image, dependsOn: [spec]}]
      contextProviders: [kernel.current-action, mechanical.mission]
      hooks: []
      transitions:
        single_part: {target: parts, requiresPhaseObligations: true}
        assembly: {target: interface, requiresPhaseObligations: true}
    interface:
      purpose: Define component boundaries, coordinate frames, fits, and motion interfaces.
      guidance: Commit every cross-part interface before allocating detailed part geometry.
      actions: [cad_commit, transition]
      grants: [file_read, transition]
      writeScopes: []
      recordObligations: [{ref: interface, type: workspace_commit, closeWith: cad_commit, dependsOn: [concept]}]
      evidenceObligations: []
      contextProviders: [kernel.current-action, mechanical.mission]
      hooks: []
      transitions: {defined: {target: architecture_bom, requiresPhaseObligations: true}}
    architecture_bom:
      purpose: Allocate functions to parts and freeze the assembly architecture and bill of materials.
      guidance: Name each part, ownership boundary, material or purchased component, and dependency before fan-out.
      actions: [cad_commit, transition]
      grants: [file_read, transition]
      writeScopes: []
      recordObligations: [{ref: architecture-bom, type: workspace_commit, closeWith: cad_commit, dependsOn: [interface]}]
      evidenceObligations: []
      contextProviders: [kernel.current-action, mechanical.mission]
      hooks: []
      transitions: {allocated: {target: parts, requiresPhaseObligations: true}}
    parts:
      rebuildContextOnExit: true
      purpose: Author deterministic part geometry and inspect the built candidate.
      guidance: >-
        Root may use ordinary Prime RLM fan-out, but every result must return through one authoritative workspace commit and managed build. In PARTS call cad.commit only for the parts workspace obligation; never commit parts-geometry or parts-visual because cad.model.build closes both evidence obligations. If inspection reveals a defect, edit and rebuild normally: the new build atomically revises this evidence and invalidates every older ArtifactRef. Keep only the latest returned ArtifactRef, then probe it, create review-candidate from it plus deterministic source, and take a transition shown in NEXT; FINAL_REVIEW cannot create commits.
      actions: [cad_build_step, cad_commit, transition]
      grants: [file_read, file_edit_source, model_build, observe, observe_programmable, shell, transition]
      writeScopes: [project:deliverable, project:source, run:observation]
      recordObligations: [{ref: parts, type: workspace_commit, closeWith: cad_commit, dependsOn: [concept]}]
      evidenceObligations:
        - {ref: parts-visual, type: visual, closeWith: cad_build_step, dependsOn: [parts]}
        - {ref: parts-geometry, type: geometry, closeWith: cad_build_step, dependsOn: [parts]}
      contextProviders: [kernel.current-action, mechanical.mission, mechanical.observations]
      hooks: [mechanical.candidate.observe]
      transitions:
        single_part_complete: {target: final_review, requiresPhaseObligations: true}
        assembly_parts_complete: {target: assembly, requiresPhaseObligations: true}
    assembly:
      rebuildContextOnExit: true
      purpose: Integrate parts and verify the complete assembly candidate.
      guidance: First close the assembly workspace obligation with assembly = await cad.commit("assembly", ...). Then call artifact = await cad.model.build(source, output, force=True); that managed build closes both assembly-geometry and assembly-visual. Never try to close those evidence obligations with cad.commit. If inspection reveals a defect, edit and rebuild into the same artifact variable. Probe fit and the motion envelope at required positions. For every moving body pair, check both common volume and minimum distance, distinguishing named intentional contacts. In the exact manufacturing orientation, verify that every print-in-place body reaches the build plane or has a self-supporting path, and inspect functional-face direction and access openings. Create review-candidate from the latest artifact plus deterministic source, and take assembled only when it appears in NEXT.
      actions: [cad_build_step, cad_commit, transition]
      grants: [file_read, file_edit_source, model_build, observe, observe_interference, observe_programmable, shell, transition]
      writeScopes: [project:deliverable, project:source, run:observation]
      recordObligations: [{ref: assembly, type: workspace_commit, closeWith: cad_commit, dependsOn: [architecture-bom, parts]}]
      evidenceObligations:
        - {ref: assembly-visual, type: visual, closeWith: cad_build_step, dependsOn: [assembly]}
        - {ref: assembly-geometry, type: geometry, closeWith: cad_build_step, dependsOn: [assembly]}
      contextProviders: [kernel.current-action, mechanical.mission, mechanical.observations]
      hooks: [mechanical.candidate.observe]
      transitions: {assembled: {target: final_review, requiresPhaseObligations: true}}
    final_review:
      purpose: Obtain an independent evidence-backed verdict on the immutable candidate.
      guidance: Submit exactly once using the review-candidate Commit object returned by cad.commit; do not submit an ArtifactRef, phase record, guessed ID, or stale commit. Wait for the host review-complete event. The reviewer chooses PASS/FAIL and the legal destination; the sidecar transitions atomically, so the author must not guess or repeat it.
      actions: [cad_submit_for_review]
      grants: [file_read, observe, observe_programmable]
      writeScopes: [run:observation]
      recordObligations: []
      evidenceObligations: []
      contextProviders: [kernel.current-action, mechanical.mission, mechanical.observations]
      hooks: []
      reviewProfile: mechanical.final-review
      transitions:
        accepted: {target: release, reviewVerdicts: [pass]}
        revise_spec: {target: spec, reviewVerdicts: [fail], invalidate: [spec]}
        revise_concept: {target: concept, reviewVerdicts: [fail], invalidate: [concept]}
        revise_interface: {target: interface, reviewVerdicts: [fail], requiresVisited: [interface], invalidate: [interface]}
        revise_architecture_bom: {target: architecture_bom, reviewVerdicts: [fail], requiresVisited: [architecture_bom], invalidate: [architecture-bom]}
        revise_parts: {target: parts, reviewVerdicts: [fail], invalidate: [parts]}
        revise_assembly: {target: assembly, reviewVerdicts: [fail], requiresVisited: [assembly], invalidate: [assembly]}
    release:
      purpose: Freeze the reviewed release commit and close the workflow.
      guidance: Commit release with the reviewed subject Commit as explicit parent and the exact reviewed artifact set with roles and hashes preserved; do not substitute, omit, or add files.
      actions: [cad_commit, transition]
      grants: [file_read, transition]
      writeScopes: []
      recordObligations: [{ref: release, type: workspace_commit, closeWith: cad_commit}]
      evidenceObligations: []
      contextProviders: [kernel.current-action]
      hooks: []
      transitions: {released: {target: done, requiresPhaseObligations: true}}
    done:
      purpose: Preserve the immutable terminal release state.
      actions: []
      grants: [file_read]
      writeScopes: []
      recordObligations: []
      evidenceObligations: []
      contextProviders: [kernel.current-action]
      hooks: []
      transitions: {}
      terminal: true
